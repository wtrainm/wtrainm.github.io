<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCE4EC"/>
      <stop offset="50%" stop-color="#E8D5F5"/>
      <stop offset="100%" stop-color="#D4E8F5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5E6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFF5E6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 圆形背景 -->
  <circle cx="200" cy="200" r="198" fill="url(#bg)"/>
  
  <!-- 小光晕 -->
  <circle cx="140" cy="120" r="80" fill="url(#glow)"/>
  
  <!-- 星星 -->
  <g fill="#FFB7C5" opacity="0.6">
    <circle cx="110" cy="100" r="3"/>
    <circle cx="260" cy="90" r="2.5"/>
    <circle cx="300" cy="140" r="2"/>
    <circle cx="100" cy="160" r="2"/>
    <circle cx="280" cy="180" r="1.5"/>
  </g>
  <g fill="#C9B1FF" opacity="0.4">
    <circle cx="150" cy="80" r="2"/>
    <circle cx="80" cy="130" r="1.5"/>
    <circle cx="320" cy="110" r="2"/>
  </g>
  
  <!-- 樱花枝干 -->
  <g fill="none" stroke="#8B6914" stroke-width="2.5" stroke-linecap="round" opacity="0.4">
    <path d="M30 320 Q60 300 100 270 Q135 245 160 210"/>
    <path d="M80 280 Q110 255 135 225"/>
  </g>
  
  <!-- 樱花 -->
  <g>
    <circle cx="100" cy="265" r="6" fill="#FFB7C5" opacity="0.7"/>
    <circle cx="108" cy="258" r="5" fill="#FFD1DC" opacity="0.8"/>
    <circle cx="95" cy="256" r="5" fill="#FFC0CB" opacity="0.6"/>
    <circle cx="130" cy="240" r="5" fill="#FFB7C5" opacity="0.7"/>
    <circle cx="137" cy="234" r="4" fill="#FFD1DC" opacity="0.8"/>
    <circle cx="160" cy="205" r="5" fill="#FFB7C5" opacity="0.7"/>
    <circle cx="167" cy="200" r="4" fill="#FFD1DC" opacity="0.8"/>
    <!-- 花芯 -->
    <circle cx="103" cy="262" r="1.5" fill="#FF6B8A" opacity="0.3"/>
    <circle cx="133" cy="237" r="1.5" fill="#FF6B8A" opacity="0.3"/>
  </g>
  
  <!-- 飘落花瓣 -->
  <g opacity="0.5">
    <ellipse cx="200" cy="280" rx="4" ry="2.5" fill="#FFB7C5" transform="rotate(25 200 280)"/>
    <ellipse cx="250" cy="250" rx="3.5" ry="2" fill="#FFD1DC" transform="rotate(-15 250 250)"/>
    <ellipse cx="180" cy="320" rx="3" ry="2" fill="#FFC0CB" transform="rotate(40 180 320)"/>
    <ellipse cx="230" cy="340" rx="3.5" ry="2" fill="#FFB7C5" transform="rotate(-30 230 340)"/>
  </g>
  
  <!-- 内圈 -->
  <circle cx="200" cy="200" r="193" fill="none" stroke="#FFB7C5" stroke-width="4" opacity="0.4"/>
</svg>
