<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- 柔和夜空渐变 -->
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2535"/>
      <stop offset="30%" stop-color="#353048"/>
      <stop offset="55%" stop-color="#403855"/>
      <stop offset="80%" stop-color="#484060"/>
      <stop offset="100%" stop-color="#504868"/>
    </linearGradient>
    <!-- 柔和月亮光辉 -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8E0E8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#E0D8E8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#E0D8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 柔和夜云 -->
    <radialGradient id="nightCloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#504868" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#504868" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nightCloud2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#484060" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#484060" stop-opacity="0"/>
    </radialGradient>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="1600" height="900" fill="url(#nightSky)"/>
  
  <!-- 柔和月辉 -->
  <circle cx="1000" cy="180" r="200" fill="url(#moonGlow)"/>
  
  <!-- 月亮 -->
  <circle cx="1000" cy="180" r="45" fill="#E8E0E8" opacity="0.75" filter="url(#starGlow)"/>
  <circle cx="985" cy="170" r="38" fill="url(#nightSky)"/>

  <!-- 柔星 -->
  <g fill="#D8D0E0" opacity="0.45">
    <circle cx="120" cy="80" r="2.5"/><circle cx="280" cy="120" r="2"/>
    <circle cx="420" cy="65" r="3"/><circle cx="550" cy="140" r="1.8"/>
    <circle cx="650" cy="90" r="2.5"/><circle cx="780" cy="150" r="1.5"/>
    <circle cx="850" cy="70" r="2"/><circle cx="1100" cy="100" r="2.5"/>
    <circle cx="1300" cy="80" r="1.8"/><circle cx="1450" cy="120" r="2.5"/>
    <circle cx="1520" cy="65" r="3"/>
  </g>
  <g fill="#C8C0D8" opacity="0.3">
    <circle cx="200" cy="180" r="1.5"/><circle cx="380" cy="200" r="2"/>
    <circle cx="580" cy="170" r="1.5"/><circle cx="720" cy="210" r="1.8"/>
    <circle cx="1150" cy="160" r="1.5"/><circle cx="1350" cy="190" r="2"/>
    <circle cx="1480" cy="170" r="1.5"/>
  </g>

  <!-- 四角星 -->
  <g fill="#D8D0E0" opacity="0.35" filter="url(#starGlow)">
    <path d="M350 110 l1.5 -4 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 Z"/>
    <path d="M750 135 l1.2 -3.5 l1.2 3.5 l3.5 1.2 l-3.5 1.2 l-1.2 3.5 l-1.2 -3.5 l-3.5 -1.2 Z"/>
    <path d="M1250 115 l1.5 -4 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 Z"/>
    <path d="M500 90 l1 -3 l1 3 l3 1 l-3 1 l-1 3 l-1 -3 l-3 -1 Z"/>
    <path d="M950 60 l1.2 -3.5 l1.2 3.5 l3.5 1.2 l-3.5 1.2 l-1.2 3.5 l-1.2 -3.5 l-3.5 -1.2 Z"/>
    <path d="M1400 100 l1 -3 l1 3 l3 1 l-3 1 l-1 3 l-1 -3 l-3 -1 Z"/>
  </g>

  <!-- 夜云 -->
  <g fill="url(#nightCloud)">
    <ellipse cx="200" cy="250" rx="100" ry="28"/>
    <ellipse cx="280" cy="240" rx="70" ry="24"/>
    <ellipse cx="140" cy="245" rx="60" ry="20"/>
  </g>
  <g fill="url(#nightCloud2)">
    <ellipse cx="1300" cy="230" rx="90" ry="26"/>
    <ellipse cx="1370" cy="220" rx="65" ry="22"/>
    <ellipse cx="1240" cy="225" rx="55" ry="18"/>
  </g>

  <!-- 夜间柔枝 -->
  <g fill="none" stroke="#605868" stroke-width="2.5" stroke-linecap="round" opacity="0.3">
    <path d="M0 520 Q50 500 120 470 Q180 440 220 400"/>
    <path d="M100 480 Q140 450 170 410"/>
    <path d="M150 440 Q180 400 200 360"/>
    <path d="M220 400 Q250 370 280 340"/>
  </g>
  <g fill="none" stroke="#605868" stroke-width="2" stroke-linecap="round" opacity="0.25">
    <path d="M1550 420 Q1500 440 1450 460 Q1400 475 1350 490"/>
  </g>

  <!-- 夜间柔樱 -->
  <g opacity="0.4">
    <circle cx="120" cy="465" r="5" fill="#706880"/>
    <circle cx="128" cy="458" r="4" fill="#807890"/>
    <circle cx="180" cy="435" r="5" fill="#706880"/>
    <circle cx="188" cy="428" r="4" fill="#807890"/>
    <circle cx="220" cy="395" r="5" fill="#706880"/>
    <circle cx="228" cy="388" r="4" fill="#807890"/>
    <circle cx="200" cy="355" r="4" fill="#706880"/>
    <circle cx="208" cy="350" r="3.5" fill="#807890"/>
    <circle cx="240" cy="295" r="4" fill="#706880"/>
    <circle cx="247" cy="290" r="3.5" fill="#807890"/>
    <circle cx="1450" cy="455" r="4" fill="#706880"/>
    <circle cx="1400" cy="480" r="4" fill="#706880"/>
  </g>

  <!-- 花瓣 -->
  <g opacity="0.25">
    <ellipse cx="320" cy="380" rx="3.5" ry="2" fill="#807890" transform="rotate(25 320 380)"/>
    <ellipse cx="420" cy="340" rx="3" ry="1.8" fill="#706880" transform="rotate(-15 420 340)"/>
    <ellipse cx="500" cy="420" rx="3.5" ry="2" fill="#908898" transform="rotate(40 500 420)"/>
    <ellipse cx="320" cy="460" rx="3" ry="1.8" fill="#807890" transform="rotate(-30 320 460)"/>
    <ellipse cx="560" cy="370" rx="3" ry="1.8" fill="#706880" transform="rotate(-10 560 370)"/>
    <ellipse cx="1180" cy="340" rx="3" ry="1.8" fill="#807890" transform="rotate(35 1180 340)"/>
    <ellipse cx="1300" cy="380" rx="2.5" ry="1.5" fill="#706880" transform="rotate(-20 1300 380)"/>
  </g>

  <ellipse cx="800" cy="870" rx="500" ry="30" fill="#403855" opacity="0.15"/>
  <rect x="0" y="840" width="1600" height="60" fill="#353048" opacity="0.12"/>
</svg>
