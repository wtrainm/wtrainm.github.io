<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- 柔色渐变天空 -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F0F5"/>
      <stop offset="30%" stop-color="#EDE4F0"/>
      <stop offset="55%" stop-color="#E8E0F0"/>
      <stop offset="80%" stop-color="#E0E8F0"/>
      <stop offset="100%" stop-color="#EDE8F0"/>
    </linearGradient>
    <!-- 柔和云朵 -->
    <radialGradient id="cloud1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5F0F5" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F5F0F5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloud2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EDE8F0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#EDE8F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 柔和光晕 -->
    <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5F0F5" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#EDE4F0" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#EDE4F0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 柔和天空 -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>
  
  <!-- 柔和光晕 -->
  <circle cx="400" cy="200" r="300" fill="url(#lightGlow)"/>
  <circle cx="1200" cy="180" r="200" fill="url(#lightGlow)"/>

  <!-- 柔云 -->
  <g fill="url(#cloud1)">
    <ellipse cx="250" cy="190" rx="90" ry="28"/>
    <ellipse cx="320" cy="180" rx="65" ry="24"/>
    <ellipse cx="190" cy="185" rx="55" ry="22"/>
  </g>
  <g fill="url(#cloud2)">
    <ellipse cx="950" cy="160" rx="100" ry="26"/>
    <ellipse cx="1030" cy="150" rx="70" ry="22"/>
    <ellipse cx="880" cy="155" rx="60" ry="20"/>
  </g>
  <g fill="url(#cloud1)" opacity="0.4">
    <ellipse cx="600" cy="210" rx="80" ry="22"/>
    <ellipse cx="660" cy="205" rx="55" ry="18"/>
  </g>
  <g fill="url(#cloud2)" opacity="0.3">
    <ellipse cx="1300" cy="180" rx="85" ry="24"/>
    <ellipse cx="1370" cy="172" rx="60" ry="20"/>
  </g>

  <!-- 柔光点 -->
  <g fill="#D8CCE0" opacity="0.35">
    <circle cx="180" cy="120" r="2.5"/><circle cx="380" cy="100" r="2"/>
    <circle cx="550" cy="140" r="3"/><circle cx="750" cy="110" r="2"/>
    <circle cx="900" cy="130" r="2.5"/><circle cx="1050" cy="100" r="1.8"/>
    <circle cx="1250" cy="120" r="2.5"/><circle cx="1450" cy="110" r="2"/>
  </g>

  <!-- 左侧樱花枝（柔色） -->
  <g fill="none" stroke="#C8B8B0" stroke-width="2.5" stroke-linecap="round" opacity="0.35">
    <path d="M0 520 Q50 500 120 470 Q180 440 220 400"/>
    <path d="M100 480 Q140 450 170 410"/>
    <path d="M150 440 Q180 400 200 360"/>
    <path d="M220 400 Q250 370 280 340"/>
    <path d="M200 360 Q220 330 240 300"/>
  </g>
  
  <!-- 右侧小枝 -->
  <g fill="none" stroke="#C8B8B0" stroke-width="2" stroke-linecap="round" opacity="0.3">
    <path d="M1550 380 Q1500 400 1450 430 Q1400 450 1350 470"/>
  </g>

  <!-- 柔色樱花 -->
  <g>
    <circle cx="120" cy="465" r="6" fill="#D8C8D0" opacity="0.5"/>
    <circle cx="128" cy="458" r="5" fill="#E0D0E0" opacity="0.6"/>
    <circle cx="115" cy="456" r="5" fill="#D0C0D0" opacity="0.45"/>
    <circle cx="125" cy="468" r="4" fill="#E8E0E8" opacity="0.5"/>
    <circle cx="180" cy="435" r="6" fill="#D8C8D0" opacity="0.5"/>
    <circle cx="188" cy="428" r="5" fill="#E0D0E0" opacity="0.6"/>
    <circle cx="175" cy="426" r="5" fill="#D0C0D0" opacity="0.45"/>
    <circle cx="220" cy="395" r="6" fill="#D8C8D0" opacity="0.5"/>
    <circle cx="228" cy="388" r="5" fill="#E0D0E0" opacity="0.6"/>
    <circle cx="215" cy="386" r="5" fill="#D0C0D0" opacity="0.45"/>
    <circle cx="200" cy="355" r="5" fill="#D8C8D0" opacity="0.5"/>
    <circle cx="208" cy="350" r="4" fill="#E0D0E0" opacity="0.6"/>
    <circle cx="240" cy="295" r="5" fill="#D8C8D0" opacity="0.4"/>
    <circle cx="247" cy="290" r="4" fill="#E0D0E0" opacity="0.5"/>
    
    <!-- 右枝 -->
    <circle cx="1450" cy="425" r="5" fill="#D8C8D0" opacity="0.35"/>
    <circle cx="1445" cy="418" r="4" fill="#E0D0E0" opacity="0.45"/>
    <circle cx="1400" cy="450" r="5" fill="#D8C8D0" opacity="0.3"/>
  </g>

  <!-- 飘落花瓣（轻柔） -->
  <g opacity="0.35">
    <ellipse cx="310" cy="350" rx="4" ry="2.5" fill="#D8C8D0" transform="rotate(25 310 350)"/>
    <ellipse cx="400" cy="310" rx="3.5" ry="2" fill="#E0D0E0" transform="rotate(-15 400 310)"/>
    <ellipse cx="480" cy="380" rx="4" ry="2.5" fill="#D0C0D0" transform="rotate(40 480 380)"/>
    <ellipse cx="300" cy="430" rx="3" ry="2" fill="#D8C8D0" transform="rotate(-30 300 430)"/>
    <ellipse cx="450" cy="480" rx="3.5" ry="2" fill="#E0D0E0" transform="rotate(20 450 480)"/>
    <ellipse cx="550" cy="340" rx="3" ry="2" fill="#D0C0D0" transform="rotate(-10 550 340)"/>
    <ellipse cx="1150" cy="280" rx="3.5" ry="2" fill="#D8C8D0" transform="rotate(35 1150 280)"/>
    <ellipse cx="1280" cy="330" rx="3" ry="2" fill="#E0D0E0" transform="rotate(-20 1280 330)"/>
    <ellipse cx="1380" cy="300" rx="4" ry="2.5" fill="#D0C0D0" transform="rotate(15 1380 300)"/>
  </g>

  <!-- 地面柔影 -->
  <ellipse cx="800" cy="870" rx="500" ry="35" fill="#E0D8E8" opacity="0.2"/>
  <rect x="0" y="830" width="1600" height="70" fill="#E8E0E8" opacity="0.2"/>
</svg>
