<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d2d5e"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0e68c"/>
      <stop offset="100%" stop-color="#d4c87a"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="200" cy="200" r="198" fill="url(#bg)"/>
  <!-- Moon -->
  <circle cx="270" cy="100" r="35" fill="url(#moon)" opacity="0.85"/>
  <circle cx="258" cy="92" r="30" fill="url(#bg)"/>
  <!-- Stars -->
  <circle cx="80" cy="80" r="3" fill="#fff" opacity="0.6"/>
  <circle cx="140" cy="60" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="100" cy="130" r="2.5" fill="#fff" opacity="0.4"/>
  <circle cx="320" cy="180" r="2" fill="#fff" opacity="0.4"/>
  <circle cx="350" cy="80" r="3" fill="#fff" opacity="0.5"/>
  <circle cx="50" cy="180" r="2" fill="#fff" opacity="0.3"/>
  <!-- Wutong tree silhouette -->
  <g fill="#0d0d1a" opacity="0.8">
    <!-- Trunk -->
    <path d="M195 340 L192 240 L196 235 L200 233 L204 235 L208 240 L205 340 Z"/>
    <!-- Branches -->
    <path d="M196 280 L150 250 Q155 243 165 245 Q180 252 196 268 Z"/>
    <path d="M204 270 L250 240 Q245 233 235 235 Q220 242 204 258 Z"/>
    <path d="M197 250 L165 215 Q170 210 180 212 Q190 220 197 240 Z"/>
    <path d="M203 240 L235 205 Q230 200 220 202 Q210 210 203 230 Z"/>
    <!-- Foliage -->
    <ellipse cx="160" cy="245" rx="25" ry="18"/>
    <ellipse cx="185" cy="225" rx="22" ry="16"/>
    <ellipse cx="200" cy="218" rx="20" ry="15"/>
    <ellipse cx="215" cy="225" rx="22" ry="16"/>
    <ellipse cx="240" cy="235" rx="25" ry="18"/>
    <!-- Upper foliage -->
    <ellipse cx="175" cy="210" rx="18" ry="14"/>
    <ellipse cx="200" cy="200" rx="18" ry="14"/>
    <ellipse cx="225" cy="210" rx="18" ry="14"/>
    <!-- Top -->
    <ellipse cx="200" cy="195" rx="15" ry="12"/>
  </g>
  <!-- Outer ring -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="#6C5CE7" stroke-width="6" opacity="0.6"/>
</svg>
