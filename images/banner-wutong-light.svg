<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#2d2d5e"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D3436"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Sky gradient -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- Stars -->
  <g fill="#fff" opacity="0.6">
    <circle cx="100" cy="80" r="1.5"/><circle cx="300" cy="120" r="1"/>
    <circle cx="500" cy="60" r="2" opacity="0.8"/><circle cx="750" cy="150" r="1.2"/>
    <circle cx="1000" cy="90" r="1.8" opacity="0.7"/><circle cx="1200" cy="130" r="1"/>
    <circle cx="1400" cy="70" r="1.5"/><circle cx="200" cy="200" r="0.8"/>
    <circle cx="600" cy="180" r="1.3"/><circle cx="900" cy="200" r="0.9"/>
    <circle cx="1100" cy="170" r="1.1"/><circle cx="1500" cy="190" r="1.6"/>
    <circle cx="400" cy="250" r="0.7"/><circle cx="1300" cy="240" r="1"/>
    <circle cx="50" cy="300" r="1.2"/><circle cx="1550" cy="50" r="1.4"/>
  </g>
  <!-- Moon -->
  <circle cx="1200" cy="120" r="40" fill="#f0e68c" opacity="0.9" filter="url(#glow)"/>
  <circle cx="1185" cy="110" r="35" fill="url(#sky)"/>
  <!-- Wutong tree silhouette - main trunk -->
  <g fill="#0d0d1a" opacity="0.85">
    <!-- Main trunk -->
    <path d="M800 900 L780 500 L790 490 L800 480 L810 490 L820 500 Z"/>
    <!-- Left main branch -->
    <path d="M790 550 Q700 480 550 450 Q580 440 620 445 Q700 460 790 520 Z"/>
    <!-- Right main branch -->
    <path d="M810 520 Q900 460 1050 430 Q1020 420 980 425 Q900 440 810 500 Z"/>
    <!-- Top branches -->
    <path d="M795 490 Q750 420 650 380 Q680 370 720 380 Q760 400 795 470 Z"/>
    <path d="M805 480 Q850 400 950 360 Q920 350 880 360 Q840 380 805 460 Z"/>
    <!-- Small branches left -->
    <path d="M550 450 Q500 400 420 370 Q440 365 470 375 Q510 390 550 440 Z"/>
    <path d="M650 380 Q600 340 530 310 Q550 305 580 315 Q620 340 650 370 Z"/>
    <!-- Small branches right -->
    <path d="M1050 430 Q1100 390 1180 360 Q1160 355 1130 365 Q1090 380 1050 420 Z"/>
    <path d="M950 360 Q1000 320 1070 290 Q1050 285 1020 295 Q980 320 950 350 Z"/>
    <!-- Foliage clusters (rounded foliage shapes) -->
    <ellipse cx="500" cy="380" rx="80" ry="50"/>
    <ellipse cx="560" cy="360" rx="70" ry="45"/>
    <ellipse cx="620" cy="350" rx="65" ry="40"/>
    <ellipse cx="680" cy="340" rx="60" ry="38"/>
    <ellipse cx="740" cy="330" rx="55" ry="35"/>
    <ellipse cx="800" cy="460" rx="30" ry="50"/>
    <ellipse cx="860" cy="330" rx="55" ry="35"/>
    <ellipse cx="920" cy="340" rx="60" ry="38"/>
    <ellipse cx="980" cy="350" rx="65" ry="40"/>
    <ellipse cx="1040" cy="370" rx="70" ry="45"/>
    <ellipse cx="1100" cy="380" rx="80" ry="50"/>
    <!-- Upper foliage -->
    <ellipse cx="600" cy="310" rx="60" ry="35"/>
    <ellipse cx="670" cy="300" rx="55" ry="30"/>
    <ellipse cx="730" cy="295" rx="50" ry="28"/>
    <ellipse cx="800" cy="290" rx="50" ry="28"/>
    <ellipse cx="870" cy="295" rx="50" ry="28"/>
    <ellipse cx="930" cy="300" rx="55" ry="30"/>
    <ellipse cx="1000" cy="310" rx="60" ry="35"/>
  </g>
  <!-- Additional foreground foliage detail -->
  <g fill="#0a0a15" opacity="0.6">
    <ellipse cx="480" cy="400" rx="50" ry="30"/>
    <ellipse cx="1120" cy="400" rx="50" ry="30"/>
    <ellipse cx="600" cy="380" rx="40" ry="25"/>
    <ellipse cx="1000" cy="380" rx="40" ry="25"/>
  </g>
  <!-- Ground/shadow -->
  <ellipse cx="800" cy="880" rx="400" ry="40" fill="#1a1a2e" opacity="0.5"/>
</svg>
